[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, in-memory PII gateway for LLM API traffic"
license = "MIT"
publish = false

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.10"
dashmap = "6.1"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
phonenumber = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
flate2 = "1.0"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "detector"
harness = false

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
