services:
  gatekeeper:
    # image: ghcr.io/legitcamper/gatekeeper:latest
    build: .
    container_name: gatekeeper
    # env_file: .env
    environment:
      TARGET_URL: http://ollama:11434
      GATEKEEPER_DB_PATH: /var/lib/gatekeeper/mappings.sqlite3
      # Opt-in: require x-gatekeeper-token when not behind a firewall/WAF.
      GATEKEEPER_CLIENT_TOKEN: ${GATEKEEPER_CLIENT_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gatekeeper_data:/var/lib/gatekeeper
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  gatekeeper_data:
  ollama:
